[package]
name = "nexio-desktop"
version = "0.1.0"
description = "1nexio Desktop — AI Workforce"
authors = ["1nexio"]
edition = "2021"

[lib]
name = "nexio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell  = "2"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
base64           = "0.22"
screenshots      = "0.8"
enigo            = { version = "0.2", features = ["x11rb"] }
